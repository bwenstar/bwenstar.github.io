{% comment %}
  Sticky header. The current section gets aria-current so it is styled and
  announced; /tennis/ and /gallery/... match by prefix.
{% endcomment %}
<header class="site-header">
  <div class="wrap header-row">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="{{ site.title }}, home">
      <span class="brand-mark" aria-hidden="true">BT</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/tennis/' | relative_url }}">Tennis</a>
      <a href="{{ '/gallery.html' | relative_url }}" {% if page.url contains '/gallery' %}aria-current="page"{% endif %}>Gallery</a>
      <a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %}aria-current="page"{% endif %}>About</a>
      {% if site.author.github %}
      <a class="icon-link" href="https://github.com/{{ site.author.github }}" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      {% endif %}
      <button id="theme-toggle" class="icon-link" type="button" aria-label="Switch to dark theme" title="Toggle light/dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      </button>
    </nav>
  </div>
</header>
