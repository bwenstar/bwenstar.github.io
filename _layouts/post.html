---
layout: default
---
<main class="wrap narrow page">
  <article class="post">
    <header class="post-header">
      <a class="back" href="{{ '/' | relative_url }}">← All notes</a>
      <h1>{{ page.title }}</h1>
      <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    </header>

    <div class="prose">
      {{ content }}
    </div>

    {% if page.tags.size > 0 %}
    <footer class="post-footer">
      <ul class="chips">
        {% for tag in page.tags %}
        <li><a href="{{ '/tag/' | append: tag | append: '/' | relative_url }}">#{{ tag }}</a></li>
        {% endfor %}
      </ul>
    </footer>
    {% endif %}
  </article>
</main>
