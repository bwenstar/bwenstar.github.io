---
layout: default
---
<main class="wrap narrow page">
  <a class="back" href="{{ '/' | relative_url }}">← Home</a>
  <h1>Tagged <span class="accent">#{{ page.tag }}</span></h1>

  <ul class="post-list">
    {% assign tagged_posts = site.tags[page.tag] %}
    {% for post in tagged_posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <span class="post-title">{{ post.title }}</span>
        <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %b %Y" }}</time>
      </a>
    </li>
    {% endfor %}
  </ul>
</main>
