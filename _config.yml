title:          "Brendan Ta"
description:    "Engineer. I build things I want to use: dashboards for tennis and public transport, solitaire for the terminal, and a 1994 Mac classic rebuilt in Go."
url:            "https://brendanta.com"
baseurl:        ""
author:
  name:         "Brendan Ta"
  avatar:       "/assets/img/borko.png"
  github:       "bwenstar"

# Project cards on the home page, in this order. Add a project here rather than
# editing index.html. Fields:
#   name, kicker (small label above the name), blurb, image (16:10, ~960x600),
#   url (where the card itself links), tags (short tech labels), links (buttons).
#   A url starting with / is on this site; anything with :// is external.
projects:
  - name:   "UQ Tennis Club dashboards"
    kicker: "Tennis"
    blurb:  "Ladders, results and player stats for every UQ Tennis Club competition, rebuilt each round from the club's Match Centre scorecards."
    image:  "/assets/img/projects/tennis.webp"
    url:    "/tennis/"
    tags:   [Python, PDF scorecards, Static site]
    links:
      - label: "Open dashboards"
        url:   "/tennis/"

  - name:   "matchcentre-dashboard"
    kicker: "Open source · Tennis"
    blurb:  "The tool behind those dashboards. Point it at a folder of Tennis Australia Match Centre PDFs, run one command, and get a season dashboard for any club."
    image:  "/assets/img/projects/matchcentre.webp"
    url:    "/matchcentre-dashboard/"
    tags:   [Python, Charts, Any club]
    links:
      - label: "Demo"
        url:   "/matchcentre-dashboard/"
      - label: "Code"
        url:   "https://github.com/bwenstar/matchcentre-dashboard"

  - name:   "go card travel dashboard"
    kicker: "Open source · Public transport"
    blurb:  "Downloads your Translink go card history and maps every trip along its real bus, train, CityCat or light rail route, with spending, streaks and filters."
    image:  "/assets/img/projects/gocard.webp"
    url:    "/translink-gocard-dashboard/"
    tags:   [Python, GTFS, Leaflet]
    links:
      - label: "Live demo"
        url:   "/translink-gocard-dashboard/"
      - label: "Code"
        url:   "https://github.com/bwenstar/translink-gocard-dashboard"

  - name:   "Soliterm"
    kicker: "Open source · Terminal game"
    blurb:  "Solitaire for your terminal: Klondike, Spider, FreeCell and ten more, played by GNOME AisleRiot's rules with the keyboard or mouse. Share codes, daily deals, and a boss key."
    image:  "/assets/img/projects/soliterm.webp"
    url:    "https://github.com/bwenstar/soliterm"
    tags:   [Python, curses, "uvx soliterm"]
    links:
      - label: "PyPI"
        url:   "https://pypi.org/project/soliterm/"
      - label: "Code"
        url:   "https://github.com/bwenstar/soliterm"

  - name:   "gliderGo"
    kicker: "Open source · Game port"
    blurb:  "A faithful Go port of John Calhoun's 1994 Macintosh classic Glider PRO: fly a paper glider through all 22 original houses. Standard-library Go only, no game engine, on Linux and Windows."
    image:  "/assets/img/projects/glidergo.webp"
    url:    "https://github.com/bwenstar/gliderGo"
    tags:   [Go, No dependencies, Linux · Windows]
    links:
      - label: "Download"
        url:   "https://github.com/bwenstar/gliderGo/releases"
      - label: "Code"
        url:   "https://github.com/bwenstar/gliderGo"

markdown: kramdown
theme: null

# Setting exclude REPLACES Jekyll's default list, it does not add to it — so the
# Ruby build files have to be named here or they get copied into _site and served.
exclude:
  - .github/
  - node_modules/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
